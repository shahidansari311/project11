name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - shahid
    # Only trigger the deployment if files in the backend change
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            # Navigate to the project folder
            cd ~/project11
            
            # Fetch the latest code and force it to match GitHub
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Go to backend and restart Docker
            cd backend
            sudo docker compose down || true
            sudo docker rm -f silver_real_estate_backend || true
            sudo docker compose up -d --build
