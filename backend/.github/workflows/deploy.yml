name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Use your specific paths. Assuming the repo is cloned at /home/ubuntu/SilverRealEstate
          script: |
            cd /home/ubuntu/SilverRealEstate/backend
            git pull origin main
            
            # Rebuild and restart the docker container securely
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Prune dangling images to save space
            docker image prune -f
